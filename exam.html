<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thi thử | H&T STUDY</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/exam.css">

</head>


<body>


<!-- ==================================================
                    BACKGROUND
================================================== -->

<div class="space-bg"></div>

<div class="overlay"></div>


<!-- ==================================================
                    HEADER
================================================== -->

<header class="header">

    <div class="container">


        <!-- ==========================
                LOGO
        =========================== -->

        <a
            class="logo"
            href="index.html"
        >

            <img
                src="assets/images/logo.png"
                alt="H&T STUDY"
            >

            <div class="logo-text">

                <h2>H&T STUDY</h2>

                <span>
                    Chinh phục tri thức
                </span>

            </div>

        </a>


        <!-- ==========================
                HEADER ACTIONS
        =========================== -->

        <div class="header-actions">


            <!-- ==========================
                    NAVIGATION
            =========================== -->

            <nav>

                <ul class="nav-menu">

                    <li>

                        <a href="index.html">
                            Trang chủ
                        </a>

                    </li>


                    <li>

                        <a href="courses.html">
                            Khóa học
                        </a>

                    </li>


                    <li>

                        <a
                            class="active"
                            href="exam.html"
                        >
                            Thi thử
                        </a>

                    </li>


                    <li>

                        <a href="#">
                            Kết quả
                        </a>

                    </li>

                </ul>

            </nav>


            <!-- ==========================
                    HEADER RIGHT
            =========================== -->

            <div class="header-right">


                <!-- ==========================
                        NOTIFICATION
                =========================== -->

                <button
                    class="notification-btn"
                    id="notificationBtn"
                >

                    <i class="fa-regular fa-bell"></i>

                    <span
                        class="badge"
                        id="notificationBadge"
                        style="display:none;"
                    >
                        0
                    </span>

                </button>


                <!-- ==========================
                        NOTIFICATION PANEL
                =========================== -->

                <div
                    class="notification-panel"
                    id="notificationPanel"
                >

                    <div class="notification-header">

                        <h3>
                            Thông báo
                        </h3>

                        <button
                            id="closeNotification"
                        >

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    </div>


                    <div
                        class="notification-list"
                        id="notificationList"
                    >

                        <div class="notification-empty">

                            <i class="fa-regular fa-bell-slash"></i>

                            <p>
                                Chưa có thông báo nào.
                            </p>

                        </div>

                    </div>

                </div>


                <!-- ==========================
                        AVATAR
                =========================== -->

                <div class="avatar">

                    <img
                        src="assets/avatars/default.jpg"
                        alt="Avatar"
                    >

                </div>


                <!-- ==========================
                        USER MENU
                =========================== -->

                <div
                    class="user-menu"
                    id="userMenu"
                >


                    <!-- USER INFO -->

                    <div
                        class="user-box"
                        id="userBox"
                        style="display:none;"
                    >

                        <div class="user-profile">

                            <img
                                id="userAvatar"
                                src="assets/avatars/default.jpg"
                                alt="Avatar"
                            >

                            <div class="user-info">

                                <h3 id="userName"></h3>

                                <p>

                                    Mã học sinh:

                                    <span id="userStudentId"></span>

                                </p>

                                <p>

                                    Vai trò:

                                    <span id="userRole"></span>

                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- MENU -->

                    <div
                        class="user-menu-list"
                        id="userMenuList"
                        style="display:none;"
                    >


                        <!-- KHÓA HỌC -->

                        <button id="myCoursesBtn">

                            <i class="fa-solid fa-book-open"></i>

                            Khóa học của tôi

                        </button>


                        <!-- QUẢN LÍ -->

                        <button
                            id="manageBtn"
                            style="display:none;"
                        >

                            <i class="fa-solid fa-screwdriver-wrench"></i>

                            Quản lí

                        </button>


                        <!-- HƯỚNG DẪN -->

                        <button id="userGuide">

                            <i class="fa-regular fa-circle-question"></i>

                            Hướng dẫn

                        </button>


                        <!-- ĐĂNG XUẤT -->

                        <button id="logoutBtn">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Đăng xuất

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</header>
<!-- ==================================================
                    FOOTER
================================================== -->

<footer class="footer">

    <div class="copyright">

        © 2026 H&T STUDY

    </div>

</footer>



<!-- ==================================================
                    JAVASCRIPT
================================================== -->

<script
    type="module"
    src="js/exam.js"
></script>


</body>

</html>

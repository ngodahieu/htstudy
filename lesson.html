<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bài học | H&T STUDY</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="space-bg"></div>

<div class="overlay"></div>

<header class="header">

<div class="container">

<a href="index.html" class="logo">

<img src="assets/images/logo.png">

<div class="logo-text">

<h2>H&T STUDY</h2>

<span>Chinh phục tri thức</span>

</div>

</a>

</div>

</header>

<section class="container">

    <button
        id="backLesson"
        class="back-button">

        <i class="fa-solid fa-arrow-left"></i>

        Quay lại

    </button>

    <h1
        id="courseTitle"
        class="real-title">

        Đang tải...

    </h1>

    <p id="courseDescription"></p>

    <div class="lesson-layout">

        <!-- MENU -->

        <aside
            id="chapterMenu"
            class="chapter-menu">

        </aside>

        <!-- NỘI DUNG -->

        <main class="lesson-view">

            <h2 id="lessonTitle">

                Chọn bài học

            </h2>

            <p id="lessonDescription">

            </p>

            <div class="lesson-tabs">

                <button
                    class="tab-btn active"
                    data-tab="video">

                    <i class="fa-solid fa-play"></i>

                    Video

                </button>

                <button
                    class="tab-btn"
                    data-tab="pdf">

                    <i class="fa-solid fa-file-pdf"></i>

                    PDF

                </button>

            </div>

            <div
                id="lessonContent"
                class="lesson-content">

            </div>

        </main>

    </div>

</section>

<script type="module"
src="js/lesson.js"></script>

</body>

</html>

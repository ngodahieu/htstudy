<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài học | H&T STUDY</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/lesson.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="space-bg"></div>
<div class="overlay"></div>

<header class="header">
<div class="container">
<a href="index.html" class="logo">
<img src="assets/images/logo.png">
<div class="logo-text">
<h2>H&T STUDY</h2>
<span>Chinh phục tri thức</span>
</div>
</a>
</div>
</header>

<section class="container">

    <!-- CỤM NÚT ĐIỀU HƯỚNG -->
    <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
        <button
            id="backLesson"
            class="back-button"
            onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
            Quay lại
        </button>
        <a href="index.html" class="back-button" style="text-decoration: none;">
            <i class="fa-solid fa-house"></i>
            Trang chủ
        </a>
    </div>

    <h1
        id="courseTitle"
        class="real-title">
        Đang tải...
    </h1>

    <p id="courseDescription"></p>

    <div class="lesson-layout">

        <!-- MENU BÊN TRÁI: DẠNG MỤC LỤC THU GỌN -->
        <aside
            id="chapterMenu"
            class="chapter-menu">
        </aside>

        <!-- NỘI DUNG BÊN PHẢI -->
        <main class="lesson-view">

            <!-- ĐÃ CHUYỂN NÚT VIDEO / PDF LÊN PHÍA TRÊN NỘI DUNG -->
<div class="lesson-tabs">
    <button
        class="tab-btn active"
        data-tab="video">
        <i class="fa-solid fa-play"></i>
        Video bài giảng
    </button>
    <button
        class="tab-btn"
        data-tab="pdf-parent">
        <i class="fa-solid fa-file-pdf"></i>
        Tài liệu PDF
        <i class="fa-solid fa-chevron-down pdf-toggle-arrow"></i>
    </button>
</div>

<!-- KHU VỰC MENU CON HIỆN RA KHI BẤM VÀO TÀI LIỆU PDF -->
<div id="pdfSubMenu" class="pdf-sub-menu" style="display: none;">
    <button class="sub-tab-btn active" data-tab="pdf-lythuyet">
        <i class="fa-solid fa-book-open"></i> Lý thuyết
    </button>
    <button class="sub-tab-btn" data-tab="pdf-baitap">
        <i class="fa-solid fa-pen-clip"></i> Bài tập
    </button>
    <button class="sub-tab-btn" data-tab="pdf-btvn">
        <i class="fa-solid fa-house-chimney"></i> BTVN
    </button>
</div>

            <h2 id="lessonTitle">
                Chọn bài học
            </h2>
            <p id="lessonDescription">
            </p>

            <div
                id="lessonContent"
                class="lesson-content">
            </div>
        </main>

    </div>

</section>

<script type="module" src="js/lesson.js"></script>

</body>
</html>
